<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>表示テスト</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8f0;
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;color:#2b2a33}
  .card{background:#fff;border-radius:20px;padding:40px 48px;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.08);max-width:520px;margin:20px}
  .ok{font-size:64px}
  h1{font-size:26px;margin:10px 0}
  p{line-height:1.8;color:#555}
  small{color:#888}
</style>
</head>
<body>
  <div class="card">
    <div class="ok">✅</div>
    <h1>このページが見えたら成功です</h1>
    <p>この端末・このネットワークから<br>GitHub Pages のページを開くことができます。</p>
    <p><small id="t"></small></p>
  </div>
  <script>document.getElementById('t').textContent='確認した日時：'+new Date().toLocaleString('ja-JP');</script>
</body>
</html>
